<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — Raven</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="nav">
    <div class="nav__inner">
      <div class="nav__left">
        <a href="/" class="nav__link">Home</a>
        <a href="/services" class="nav__link">Services</a>
      </div>
      <a href="/" class="nav__brand">
        <div class="nav__mark">
          <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
            <defs><linearGradient id="rg1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#5a67d8"/><stop offset="100%" style="stop-color:#3b4fc4"/></linearGradient></defs>
            <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#rg1)"/>
            <path d="M48 16c-4 0-8 2-11 5-2-3-5-5-9-5-6 0-11 4-12 10-1 4 0 8 2 11l-4 8c-1 2 0 4 2 4h2c2 0 4-1 5-3l4-6c3 1 6 1 9 0l4 6c1 2 3 3 5 3h2c2 0 3-2 2-4l-4-8c2-3 3-7 2-11-1-6-6-10-12-10z" fill="white" opacity="0.95"/>
            <circle cx="38" cy="22" r="2" fill="url(#rg1)"/>
          </svg>
        </div>
        <span>Raven</span>
      </a>
      <div class="nav__right">
        <a href="/pricing" class="nav__link">Pricing</a>
        <a href="/login" class="nav__cta">Sign In</a>
      </div>
      <button class="nav__menu-btn" aria-label="Toggle menu"><span></span><span></span><span></span></button>
    </div>
  </nav>

  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-card__header">
        <div style="display:flex; align-items:center; gap:10px; justify-content:center; margin-bottom:20px;">
          <div class="footer__mark" style="width:32px;height:32px;">
            <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
              <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#rg1)"/>
              <path d="M48 16c-4 0-8 2-11 5-2-3-5-5-9-5-6 0-11 4-12 10-1 4 0 8 2 11l-4 8c-1 2 0 4 2 4h2c2 0 4-1 5-3l4-6c3 1 6 1 9 0l4 6c1 2 3 3 5 3h2c2 0 3-2 2-4l-4-8c2-3 3-7 2-11-1-6-6-10-12-10z" fill="white" opacity="0.95"/>
              <circle cx="38" cy="22" r="2" fill="url(#rg1)"/>
            </svg>
          </div>
          <span style="font-size:20px;font-weight:700;">Raven</span>
        </div>
        <h1 class="auth-card__title">Reset your password</h1>
        <p class="auth-card__desc">Enter your email and we'll send you a link to reset your password.</p>
      </div>

      <form id="forgotPasswordForm" class="auth-form">
        <div class="form-group">
          <label class="form-label" for="resetEmail">Work email</label>
          <input type="email" id="resetEmail" class="form-input" placeholder="name@company.com" required>
        </div>
        <button type="submit" class="btn btn--primary btn--block btn--lg">Send reset link</button>
      </form>

      <div id="successMessage" class="alert alert--success hidden" style="margin-top:20px;">
        If your email is registered, you'll receive a password reset link shortly.
      </div>

      <div class="auth-footer">
        <a href="/login">← Back to login</a>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin;
    
    document.getElementById('forgotPasswordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const email = document.getElementById('resetEmail').value;
      const submitBtn = form.querySelector('button[type="submit"]');
      const successMsg = document.getElementById('successMessage');
      
      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending...';
      successMsg.classList.add('hidden');
      
      try {
        const res = await fetch(`${API_BASE}/api/auth/forgot-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        
        const data = await res.json();
        
        if (!res.ok) throw new Error(data.error || 'Failed to send reset link');
        
        successMsg.classList.remove('hidden');
        form.reset();
      } catch (err) {
        alert(err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send reset link';
      }
    });
  </script>
</body>
</html>
