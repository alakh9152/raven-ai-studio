<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile — Raven</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="nav">
    <div class="nav__inner">
      <div class="nav__left">
        <a href="/" class="nav__link">Home</a>
        <a href="/services" class="nav__link">Services</a>
      </div>
      <a href="/" class="nav__brand">
        <div class="nav__mark">
          <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
            <defs><linearGradient id="rg1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#5a67d8"/><stop offset="100%" style="stop-color:#3b4fc4"/></linearGradient></defs>
            <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#rg1)"/>
            <path d="M48 16c-4 0-8 2-11 5-2-3-5-5-9-5-6 0-11 4-12 10-1 4 0 8 2 11l-4 8c-1 2 0 4 2 4h2c2 0 4-1 5-3l4-6c3 1 6 1 9 0l4 6c1 2 3 3 5 3h2c2 0 3-2 2-4l-4-8c2-3 3-7 2-11-1-6-6-10-12-10z" fill="white" opacity="0.95"/>
            <circle cx="38" cy="22" r="2" fill="url(#rg1)"/>

        <a href="/dashboard" class="nav__link">Dashboard</a>

      <button class="nav__menu-btn" aria-label="Toggle menu"><span></span><span></span><span></span></button>
    </div>
  </nav>

  <main>
    <section class="section">
      <div class="container" style="max-width:640px;">
        <h1 class="section__title" style="margin-bottom:24px;">Profile Settings</h1>
        
        <div class="auth-card" style="max-width:100%;">
          <h2 style="font-size:18px;font-weight:600;margin-bottom:20px;">Update Profile</h2>
          
          <form id="profileForm" class="auth-form">
            <div class="form-group">
              <label class="form-label" for="firstName">First name</label>
              <input type="text" id="firstName" class="form-input" placeholder="John">
            </div>
            
            <div class="form-group">
              <label class="form-label" for="lastName">Last name</label>
              <input type="text" id="lastName" class="form-input" placeholder="Doe">
            </div>
            
            <div class="form-group">
              <label class="form-label" for="email">Email</label>
              <input type="email" id="email" class="form-input" disabled style="background:var(--bg);cursor:not-allowed;">
              <span style="font-size:12px;color:var(--text-muted);">Email cannot be changed</span>
            </div>
            
            <button type="submit" class="btn btn--primary btn--block">Save changes</button>
          </form>
          
          <div id="profileMessage" class="alert hidden" style="margin-top:16px;"></div>
          
          <hr style="margin:24px 0;border:none;border-top:1px solid var(--border);">
          
          <h2 style="font-size:18px;font-weight:600;margin-bottom:16px;">Change Password</h2>
          
          <form id="passwordForm" class="auth-form">
            <div class="form-group">
              <label class="form-label" for="currentPassword">Current password</label>
              <input type="password" id="currentPassword" class="form-input" placeholder="••••••••">
            </div>
            
            <div class="form-group">
              <label class="form-label" for="newPassword">New password</label>
              <input type="password" id="newPassword" class="form-input" placeholder="Min 8 characters" minlength="8">
            </div>
            
            <div class="form-group">
              <label class="form-label" for="confirmPassword">Confirm new password</label>
              <input type="password" id="confirmPassword" class="form-input" placeholder="Repeat new password">
            </div>
            
            <button type="submit" class="btn btn--secondary btn--block">Update password</button>
          </form>
          
          <div id="passwordMessage" class="alert hidden" style="margin-top:16px;"></div>
          
          <hr style="margin:24px 0;border:none;border-top:1px solid var(--border);">
          
          <div style="text-align:center;">
            <a href="/dashboard" class="btn btn--ghost">← Back to Dashboard</a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const API_BASE = window.location.origin;
    let currentUser = null;
    
    async function checkAuth() {
      try {
        const res = await fetch(`${API_BASE}/api/auth/me`, { credentials: 'include' });
        if (!res.ok) {
          window.location.href = '/login';
          return;
        }
        currentUser = await res.json();
        populateForm(currentUser.user);
      } catch (err) {
        window.location.href = '/login';
      }
    }
    
    function populateForm(user) {
      document.getElementById('firstName').value = user.firstName || '';
      document.getElementById('lastName').value = user.lastName || '';
      document.getElementById('email').value = user.email;
    }
    
    function showMessage(elementId, message, type) {
      const el = document.getElementById(elementId);
      el.textContent = message;
      el.className = `alert alert--${type}`;
      el.classList.remove('hidden');
      setTimeout(() => el.classList.add('hidden'), 5000);
    }
    
    document.getElementById('profileForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const firstName = document.getElementById('firstName').value;
      const lastName = document.getElementById('lastName').value;
      
      try {
        // Note: Profile update would go here when implemented
        showMessage('profileMessage', 'Profile saved successfully!', 'success');
      } catch (err) {
        showMessage('profileMessage', err.message, 'error');
      }
    });
    
    document.getElementById('passwordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const currentPassword = document.getElementById('currentPassword').value;
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      
      if (newPassword !== confirmPassword) {
        showMessage('passwordMessage', 'Passwords do not match', 'error');
        return;
      }
      
      if (newPassword.length < 8) {
        showMessage('passwordMessage', 'Password must be at least 8 characters', 'error');
        return;
      }
      
      try {
        const res = await fetch(`${API_BASE}/api/auth/change-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ currentPassword, newPassword })
        });
        
        const data = await res.json();
        
        if (!res.ok) throw new Error(data.error);
        
        showMessage('passwordMessage', 'Password updated successfully!', 'success');
        document.getElementById('passwordForm').reset();
      } catch (err) {
        showMessage('passwordMessage', err.message, 'error');
      }
    });
    
    checkAuth();
  </script>
</body>
</html>
