<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Raven</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Navigation with centered logo -->
  <nav class="nav">
    <div class="nav__inner">
      <div class="nav__left">
        <a href="/" class="nav__link">Services</a>
        <a href="/work" class="nav__link">Work</a>
      </div>
      
      <a href="/" class="nav__brand">
        <div class="nav__mark"></div>
        <span>Raven</span>
      </a>
      
      <div class="nav__right">
        <a href="/pricing" class="nav__link">Pricing</a>
        <a href="/faq" class="nav__link">FAQ</a>
      </div>
      
      <button class="nav__menu-btn" aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </nav>

  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-card__header">
        <div class="footer__logo" style="justify-content: center; margin-bottom: 20px;">
          <div class="footer__mark"></div>
          <span style="font-size: 20px; font-weight: 700;">Raven</span>
        </div>
        <h1 class="auth-card__title" id="formTitle">Sign in to portal</h1>
        <p class="auth-card__desc" id="formDesc">Access your project dashboard and agent telemetry.</p>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="auth-form">
        <div class="form-group">
          <label class="form-label" for="loginEmail">Work email</label>
          <input type="email" id="loginEmail" class="form-input" placeholder="name@company.com" required>
        </div>
        
        <div class="form-group">
          <label class="form-label" for="loginPassword">Password</label>
          <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" required>
        </div>
        
        <div class="form-row">
          <label style="display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer;">
            <input type="checkbox" style="accent-color: var(--brand);"> Remember me
          </label>
          <a href="#" class="form-link">Forgot password?</a>
        </div>
        
        <button type="submit" class="btn btn--primary btn--block btn--lg">Sign in</button>
      </form>

      <!-- Register Form (hidden by default) -->
      <form id="registerForm" class="auth-form hidden">
        <div class="form-group">
          <label class="form-label" for="registerFirstName">First name</label>
          <input type="text" id="registerFirstName" class="form-input" placeholder="John">
        </div>
        
        <div class="form-group">
          <label class="form-label" for="registerLastName">Last name</label>
          <input type="text" id="registerLastName" class="form-input" placeholder="Doe">
        </div>
        
        <div class="form-group">
          <label class="form-label" for="registerEmail">Work email</label>
          <input type="email" id="registerEmail" class="form-input" placeholder="name@company.com" required>
        </div>
        
        <div class="form-group">
          <label class="form-label" for="registerPassword">Password</label>
          <input type="password" id="registerPassword" class="form-input" placeholder="Min 8 characters" required minlength="8">
        </div>
        
        <button type="submit" class="btn btn--primary btn--block btn--lg">Create account</button>
      </form>

      <div class="divider">or continue with</div>
      
      <div class="sso-buttons">
        <button class="sso-btn" onclick="alert('SSO integration coming soon')">
          <svg viewBox="0 0 24 24"><path d="M12 0c-6.627 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235-1.911 1.235-3.221 0-4.609-2.807-5.624-5.479-5.921.43-.372.823-1.102.823-2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
          Sign in with GitHub
        </button>
        <button class="sso-btn" onclick="alert('SSO integration coming soon')">
          <svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
          Sign in with Google
        </button>
      </div>
      
      <div class="auth-footer">
        <span id="footerText">Don't have an account? </span>
        <a href="#" id="toggleForm">Sign up</a>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    // Toggle between login and register forms
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const toggleForm = document.getElementById('toggleForm');
    const formTitle = document.getElementById('formTitle');
    const formDesc = document.getElementById('formDesc');
    const footerText = document.getElementById('footerText');
    
    let isRegister = false;
    
    // Check URL for register parameter
    if (new URLSearchParams(window.location.search).get('register') === 'true') {
      isRegister = true;
    }
    
    function toggleFormMode() {
      isRegister = !isRegister;
      
      if (isRegister) {
        loginForm.classList.add('hidden');
        registerForm.classList.remove('hidden');
        formTitle.textContent = 'Create account';
        formDesc.textContent = 'Start building with Raven today.';
        footerText.textContent = 'Already have an account? ';
        toggleForm.textContent = 'Sign in';
      } else {
        registerForm.classList.add('hidden');
        loginForm.classList.remove('hidden');
        formTitle.textContent = 'Sign in to portal';
        formDesc.textContent = 'Access your project dashboard and agent telemetry.';
        footerText.textContent = "Don't have an account? ";
        toggleForm.textContent = 'Sign up';
      }
    }
    
    toggleForm.addEventListener('click', (e) => {
      e.preventDefault();
      toggleFormMode();
    });
    
    // Initialize form state
    if (isRegister) {
      toggleFormMode();
    }
  </script>
</body>
</html>
