<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects — Raven</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="nav">
    <div class="nav__inner">
      <div class="nav__left">
        <a href="/" class="nav__link">Home</a>
        <a href="/services" class="nav__link">Services</a>
      </div>
      <a href="/" class="nav__brand">
        <div class="nav__mark">
          <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
            <defs><linearGradient id="rg1" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#5a67d8"/><stop offset="100%" style="stop-color:#3b4fc4"/></linearGradient></defs>
            <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#rg1)"/>
            <path d="M48 16c-4 0-8 2-11 5-2-3-5-5-9-5-6 0-11 4-12 10-1 4 0 8 2 11l-4 8c-1 2 0 4 2 4h2c2 0 4-1 5-3l4-6c3 1 6 1 9 0l4 6c1 2 3 3 5 3h2c2 0 3-2 2-4l-4-8c2-3 3-7 2-11-1-6-6-10-12-10z" fill="white" opacity="0.95"/>
            <circle cx="38" cy="22" r="2" fill="url(#rg1)"/>
          </svg>
        </div>
        <span>Raven</span>
      </a>
      <div class="nav__right">
        <a href="/pricing" class="nav__link">Pricing</a>
        <a href="/login" class="nav__cta">Client Portal</a>
      </div>
      <button class="nav__menu-btn" aria-label="Toggle menu"><span></span><span></span><span></span></button>
    </div>
  </nav>

  <main>
    <section class="section">
      <div class="container">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:32px;">
          <div>
            <h1 class="section__title" style="margin-bottom:8px;">My Projects</h1>
            <p class="section__desc">Manage your active projects and track progress.</p>
          </div>
          <a href="/dashboard" class="btn btn--secondary">← Back to Dashboard</a>
        </div>

        <div id="projectsContainer">
          <div style="text-align:center;padding:60px 0;color:var(--text-muted);">
            <div class="spinner" style="margin:0 auto 16px;"></div>
            <p>Loading projects...</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const API_BASE = window.location.origin;
    let currentUser = null;
    
    async function checkAuth() {
      try {
        const res = await fetch(`${API_BASE}/api/auth/me`, { credentials: 'include' });
        if (!res.ok) {
          window.location.href = '/login';
          return;
        }
        currentUser = await res.json();
        loadProjects();
      } catch (err) {
        window.location.href = '/login';
      }
    }
    
    async function loadProjects() {
      try {
        const res = await fetch(`${API_BASE}/api/dashboard/projects`, { credentials: 'include' });
        const container = document.getElementById('projectsContainer');
        
        if (!res.ok) throw new Error('Failed to load projects');
        
        const projects = await res.json();
        
        if (projects.length === 0) {
          container.innerHTML = `
            <div style="text-align:center;padding:60px 0;">
              <h3 style="font-size:18px;margin-bottom:8px;">No projects yet</h3>
              <p style="color:var(--text-soft);margin-bottom:24px;">Get started by contacting us about your first project.</p>
              <a href="/contact" class="btn btn--primary">Start a project</a>
            </div>`;
          return;
        }
        
        container.innerHTML = `<div class="cards" style="grid-template-columns:repeat(auto-fill,minmax(320px,1fr));">${projects.map(p => `
          <article class="card">
            <h3 class="card__title">${p.name}</h3>
            <p class="card__desc">${p.description || 'No description yet.'}</p>
            <div class="card__tags">
              <span class="tag" style="background:${p.status === 'active' ? 'var(--brand-light)' : 'var(--bg)'};color:${p.status === 'active' ? 'var(--brand)' : 'var(--text-muted)'}">${p.status}</span>
              <span class="tag">${new Date(p.created_at).toLocaleDateString()}</span>
            </div>
          </article>
        `).join('')}</div>`;
      } catch (err) {
        document.getElementById('projectsContainer').innerHTML = `
          <div style="text-align:center;padding:40px;color:#c02a2a;">
            <p>Failed to load projects. <a href="/dashboard" style="color:var(--brand);">Try again</a></p>
          </div>`;
      }
    }
    
    checkAuth();
  </script>
</body>
</html>
